<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Pagamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B211F;--bg2:#141917;--card:#242828;--card-border:rgba(255,255,255,.08);--ink:#EDEDE3;--muted:#9CA3A0;--gold:#DBB54A}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%, #223028 0%, var(--bg) 45%, var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:460px;padding:24px 16px 90px}
h1{font-family:'Bitter',serif;font-weight:700;font-size:28px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.top-actions{display:flex;gap:10px;margin-bottom:18px}
details.calc{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;margin-bottom:18px}
details.calc summary{font-family:'Bitter',serif;font-weight:700;font-size:15px;cursor:pointer;list-style:none}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11.5px;color:var(--muted)}
.field input{background:#141A18;border:1px solid var(--card-border);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:15px}
.calc-result{margin-top:12px;padding:10px 12px;background:rgba(216,181,74,.1);border:1px solid rgba(216,181,74,.35);border-radius:8px;font-size:13px}
.calc-result b{color:var(--gold);font-family:'Bitter'}
button{font-family:'Work Sans';font-weight:600;border:none;border-radius:8px;cursor:pointer}
.btn-gold{background:var(--gold);color:#2A2000;padding:9px 14px;font-size:13.5px}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--card-border);padding:6px 10px;font-size:12px}
.people{display:flex;flex-direction:column;gap:16px}
.person{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px}
.person-head{display:flex;justify-content:space-between;gap:8px}
.person-name{font-family:'Bitter';font-weight:700;font-size:17px}
.person-meta{color:var(--muted);font-size:12px;margin-top:2px}
.icon-btn{background:transparent;border:1px solid var(--card-border);color:var(--muted);width:30px;height:30px;border-radius:8px}
.progress-track{height:6px;background:rgba(255,255,255,.1);border-radius:999px;margin:12px 0 10px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:999px}
.week-label{font-size:11px;color:var(--muted);margin:8px 0 6px}
.days-row{display:grid;gap:6px}
.day-btn{background:#1E2422;border:1px solid var(--card-border);color:var(--ink);border-radius:8px;padding:8px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center}
.day-btn.paid{background:var(--gold);color:#2A2000;border-color:var(--gold)}
.day-num{font-size:9px;opacity:.7}
.foot-row{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}
.remaining{color:var(--gold)}
.empty{padding:30px 16px;text-align:center;color:var(--muted);border:1px dashed var(--card-border);border-radius:16px}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2A2000;padding:14px 22px;border-radius:999px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:10}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.modal-box{background:#222827;border-radius:18px 18px 0 0;width:100%;max-width:460px;padding:18px 16px 24px;max-height:90vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.check{border:1px solid var(--card-border);border-radius:999px;padding:6px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.check input{accent-color:var(--gold)}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions button{flex:1;padding:12px}
</style>
</head>
<body>
<div class="app">
  <h1>Controle de Pagamentos</h1>
  <div class="sub">Sem login. Toque nos dias para marcar como pago. Salvo no celular.</div>
  <div class="top-actions">
    <button class="btn-gold" id="btnAdd" style="flex:1">+ Adicionar cliente</button>
    <button class="btn-ghost" id="btnExport">Exportar</button>
  </div>
  <details class="calc">
    <summary>Calculadora rapida</summary>
    <div class="calc-grid">
      <div class="field"><label>Valor por dia</label><input id="calcDaily" type="number" placeholder="50"></div>
      <div class="field"><label>Qtd dias</label><input id="calcDays" type="number" placeholder="20"></div>
      <div class="field"><label>Juros %</label><input id="calcPercent" type="number" placeholder="0"></div>
      <div class="field"><label>Total</label><input id="calcTotal" readonly></div>
    </div>
    <div class="calc-result" id="calcRes">Preencha os valores.</div>
    <button class="btn-gold" id="btnUseCalc" style="margin-top:10px">Usar no cadastro</button>
  </details>
  <div class="people" id="peopleList"></div>
</div>
<button class="fab" id="fabAdd">+ Cliente</button>
<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Novo cliente</h2>
    <div class="field"><label>Nome</label><input id="fName" placeholder="Ex: Joao"></div>
    <div class="row"><div class="field"><label>Valor dia</label><input id="fDaily" type="number"></div><div class="field"><label>N dias</label><input id="fNumDays" type="number"></div></div>
    <div class="row"><div class="field"><label>Total</label><input id="fTotal" type="number"></div><div class="field"><label>Juros %</label><input id="fPercent" type="number"></div></div>
    <div class="field"><label>Dias da semana</label></div>
    <div class="checks" id="checksDays"></div>
    <div class="field"><label>Data inicio</label><input id="fStart" type="date"></div>
    <div class="modal-actions"><button class="btn-ghost" id="btnCancel">Cancelar</button><button class="btn-gold" id="btnSave">Salvar</button></div>
  </div>
</div>
<script>
const WEEKDAYS=[{code:1,label:'Seg'},{code:2,label:'Ter'},{code:3,label:'Qua'},{code:4,label:'Qui'},{code:5,label:'Sex'},{code:6,label:'Sab'},{code:0,label:'Dom'}];
let people=JSON.parse(localStorage.getItem('controle_pag_v3')||'[]');
let editingId=null;
function save(){localStorage.setItem('controle_pag_v3',JSON.stringify(people));}
function fmtBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtDate(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function monthLabel(d){return d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'});}
function nextDates(start,activeDays,count){const res=[];let cur=new Date(start);cur.setHours(12,0,0,0);while(res.length<count){if(activeDays.includes(cur.getDay())){res.push({code:cur.getDay(),date:new Date(cur)});}cur.setDate(cur.getDate()+1);if(res.length>600)break;}return res;}
function buildSchedule(p){const start=new Date(p.startDate);const occ=nextDates(start,p.activeDays,p.numDays);const perWeek=p.activeDays.length||1;const weeks=[];occ.forEach((o,i)=>{const wk=Math.floor(i/perWeek);if(!weeks[wk])weeks[wk]=[];weeks[wk].push({index:i,label:WEEKDAYS.find(x=>x.code===o.code)?.label||'',dateStr:fmtDate(o.date),monthYear:monthLabel(o.date)});});return {weeks,perWeek};}
const peopleList=document.getElementById('peopleList');
function render(){if(!people.length){peopleList.innerHTML='<div class="empty">Nenhum cliente ainda.<br>Toque em + Cliente</div>';return;}peopleList.innerHTML=people.map(p=>{const paidCount=p.paidDays.filter(Boolean).length;const paidAmount=Math.min(paidCount*p.dailyValue,p.totalAmount);const remaining=Math.max(p.totalAmount-paidAmount,0);const pct=p.totalAmount>0?Math.min(100,(paidAmount/p.totalAmount)*100):0;const activeLabels=WEEKDAYS.filter(d=>p.activeDays.includes(d.code)).map(d=>d.label).join(', ');const {weeks,perWeek}=buildSchedule(p);const weeksHtml=weeks.map((week,wi)=>`<div><div class="week-label">Semana ${wi+1} · ${week[0].monthYear}</div><div class="days-row" style="grid-template-columns:repeat(${perWeek},1fr)">${week.map(d=>`<button class="day-btn ${p.paidDays[d.index]?'paid':''}" data-id="${p.id}" data-index="${d.index}">${d.label}<span class="day-num">${d.dateStr}</span></button>`).join('')}</div></div>`).join('');return `<div class="person"><div class="person-head"><div><div class="person-name">${p.name}</div><div class="person-meta">${fmtBRL(p.dailyValue)}/dia · ${p.numDays} dias · ${activeLabels}${p.percent?' · +'+p.percent+'%':''}</div></div><div><button class="icon-btn" data-edit="${p.id}">✎</button> <button class="icon-btn" data-del="${p.id}">🗑</button></div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>${weeksHtml}<div class="foot-row"><span>Pago: ${fmtBRL(paidAmount)} ${paidCount}/${p.numDays}</span><span class="remaining">Falta ${fmtBRL(remaining)}</span></div><div style="margin-top:10px"><button class="btn-ghost" data-reset="${p.id}">Reiniciar</button></div></div>`;}).join('');}
render();
const calcDaily=document.getElementById('calcDaily'),calcDays=document.getElementById('calcDays'),calcPercent=document.getElementById('calcPercent'),calcTotal=document.getElementById('calcTotal'),calcRes=document.getElementById('calcRes');
function recalc(){const d=parseFloat(calcDaily.value)||0;const n=parseInt(calcDays.value)||0;const perc=parseFloat(calcPercent.value)||0;if(!d||!n){calcRes.textContent='Preencha os valores.';calcTotal.value='';return;}let total=d*n;if(perc)total+=total*(perc/100);calcTotal.value=total.toFixed(2);calcRes.innerHTML=n+' dias x '+fmtBRL(d)+' = '+fmtBRL(d*n)+(perc?` + ${perc}% = <b>${fmtBRL(total)}</b>`:'');}
[calcDaily,calcDays,calcPercent].forEach(el=>el.addEventListener('input',recalc));
const modal=document.getElementById('modal'),fName=document.getElementById('fName'),fDaily=document.getElementById('fDaily'),fNumDays=document.getElementById('fNumDays'),fTotal=document.getElementById('fTotal'),fPercent=document.getElementById('fPercent'),fStart=document.getElementById('fStart'),checksDays=document.getElementById('checksDays');
WEEKDAYS.forEach(w=>{const lab=document.createElement('label');lab.className='check';lab.innerHTML=`<input type="checkbox" value="${w.code}"> ${w.label}`;checksDays.appendChild(lab);});
function openModal(p=null){if(p){editingId=p.id;document.getElementById('modalTitle').textContent='Editar cliente';fName.value=p.name;fDaily.value=p.dailyValue;fNumDays.value=p.numDays;fTotal.value=p.totalAmount;fPercent.value=p.percent||'';fStart.value=p.startDate;checksDays.querySelectorAll('input').forEach(i=>{i.checked=p.activeDays.includes(parseInt(i.value));});}else{editingId=null;document.getElementById('modalTitle').textContent='Novo cliente';fName.value='';fDaily.value=calcDaily.value||'';fNumDays.value=calcDays.value||'';fTotal.value=calcTotal.value||'';fPercent.value=calcPercent.value||'';fStart.value=new Date().toISOString().slice(0,10);checksDays.querySelectorAll('input').forEach(i=>{i.checked=[1,2,3,4,5].includes(parseInt(i.value));});}modal.classList.add('open');}
function closeModal(){modal.classList.remove('open');}
document.getElementById('btnAdd').onclick=()=>openModal();document.getElementById('fabAdd').onclick=()=>openModal();document.getElementById('btnCancel').onclick=closeModal;
document.getElementById('btnUseCalc').onclick=()=>{openModal();};
document.getElementById('btnSave').onclick=()=>{const name=fName.value.trim();if(!name){alert('Digite o nome');return;}const daily=parseFloat(fDaily.value)||0;const numDays=parseInt(fNumDays.value)||0;const total=parseFloat(fTotal.value)||0;const activeDays=[...checksDays.querySelectorAll('input:checked')].map(i=>parseInt(i.value));const startDate=fStart.value||new Date().toISOString().slice(0,10);if(!daily||!numDays){alert('Valor por dia e dias');return;}if(!activeDays.length){alert('Selecione dias da semana');return;}let finalTotal=total|| ( ()=>{let t=daily*numDays;const perc=parseFloat(fPercent.value)||0;if(perc)t+=t*(perc/100);return t;})();if(editingId){const idx=people.findIndex(p=>p.id===editingId);if(idx>=0){people[idx]={...people[idx],name,dailyValue:daily,numDays,totalAmount:finalTotal,percent:parseFloat(fPercent.value)||0,activeDays,startDate};}}else{people.push({id:Date.now().toString(),name,dailyValue:daily,numDays,totalAmount:finalTotal,percent:parseFloat(fPercent.value)||0,activeDays,startDate,paidDays:Array(numDays).fill(false)});}save();render();closeModal();};
peopleList.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const id=btn.getAttribute('data-id')||btn.getAttribute('data-edit')||btn.getAttribute('data-del')||btn.getAttribute('data-reset');if(btn.hasAttribute('data-index')){const idx=parseInt(btn.getAttribute('data-index'));const p=people.find(x=>x.id===id);if(p){p.paidDays[idx]=!p.paidDays[idx];save();render();}}else if(btn.hasAttribute('data-edit')){const p=people.find(x=>x.id===id);if(p)openModal(p);}else if(btn.hasAttribute('data-del')){if(confirm('Apagar cliente?')){people=people.filter(x=>x.id!==id);save();render();}}else if(btn.hasAttribute('data-reset')){const p=people.find(x=>x.id===id);if(p&&confirm('Reiniciar pagamentos?')){p.paidDays=Array(p.numDays).fill(false);save();render();}}});
document.getElementById('btnExport').onclick=()=>{if(!people.length){alert('Nenhum cliente');return;}let txt='CONTROLE DE PAGAMENTOS\n\n';people.forEach(p=>{const paid=p.paidDays.filter(Boolean).length;txt+=`${p.name} - ${paid}/${p.numDays} - Pago ${paid*p.dailyValue} - Falta ${p.totalAmount-paid*p.dailyValue}\n`;});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clientes.txt';a.click();};
</script>
</body>
</html>
